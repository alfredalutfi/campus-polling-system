# =============================================================
# Konfigurasi Nginx - Frontend Campus Polling System
# =============================================================
# 1. Menyajikan file statis (index.html) dari folder bind mount ./frontend
# 2. Menjadi REVERSE PROXY: request /api/* diteruskan ke kontainer backend
#    lewat Custom Bridge Network "app-net" memakai nama service "backend"
#    (DNS internal Docker), bukan alamat IP.

server {
    listen 80;
    listen [::]:80;      # IPv6 juga (di dalam kontainer, 'localhost' bisa mengarah ke ::1)
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Matikan sendfile agar perubahan file di bind mount langsung terbaca
    sendfile off;

    # ---------- Frontend (file statis dari bind mount) ----------
    location / {
        try_files $uri $uri/ /index.html;
        # Jangan di-cache: edit index.html di host -> refresh browser -> langsung berubah
        add_header Cache-Control "no-store";
    }

    # ---------- Reverse proxy ke Backend API ----------
    # Contoh: GET /api/votes  -->  http://backend:5000/votes
    location /api/ {
        # 127.0.0.11 = DNS server internal milik Docker (ada di setiap custom network).
        # Dengan resolver + variabel, Nginx me-resolve ulang nama "backend" setiap
        # 10 detik. Jadi kalau kontainer backend dihapus & dibuat ulang (IP berubah),
        # Nginx tetap bisa menemukannya tanpa perlu di-restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:5000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }

    # Halaman error saat backend mati -> tetap JSON agar mudah dibaca frontend
    error_page 502 503 504 = @backend_down;
    location @backend_down {
        default_type application/json;
        return 503 '{"error":"Backend API sedang tidak tersedia (kontainer backend mati?)","status":503}';
    }
}
